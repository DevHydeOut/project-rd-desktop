<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' https: data:" />
  <title>ProjectRD</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <!-- The shell chrome: OUR code, fully trusted, separate from any tab's
       content (the live platform app). See src/preload/shell.ts for the
       narrow window.shellApi surface this talks to. -->
  <div id="chrome">
    <!-- tabstrip-row holds tabs + new-tab button together (NOT flex:1 on
         tabstrip alone) so "+" always sits right after the last tab instead
         of being pushed to the far edge when there's slack space — the
         "new tab button should be close to the tabs" fix. chrome-spacer
         absorbs the remaining draggable width instead. -->
    <div id="tabstrip-row">
      <div id="tabstrip" role="tablist" aria-label="Open tabs"></div>
      <button id="new-tab-btn" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="chrome-spacer"></div>
  </div>
  <div id="toolbar">
    <button id="back-btn" title="Back" aria-label="Back" disabled>
      <svg viewBox="0 0 16 16" width="19" height="19"><path d="M10 3l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="forward-btn" title="Forward" aria-label="Forward" disabled>
      <svg viewBox="0 0 16 16" width="19" height="19"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="reload-btn" title="Reload" aria-label="Reload">
      <svg viewBox="0 0 16 16" width="17" height="17"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5V6H10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <!-- "History of pages open today" — a Chrome-style small dropdown arrow
         next to navigation, not the back/forward buttons themselves. -->
    <button id="history-btn" title="Today's history" aria-label="Today's history">
      <svg viewBox="0 0 16 16" width="12" height="12"><path d="M3 5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <!-- Suggestions render in a separate popup window (main/popup.ts), not
         here — anything the shell page renders below the chrome strip is
         covered by the active tab's native WebContentsView. -->
    <div id="address-wrap">
      <img id="address-logo" src="logo.png" alt="" width="18" height="18" />
      <input id="address-bar" type="text" spellcheck="false" autocomplete="off" placeholder="Search ProjectRD or jump to a page" />
    </div>

    <!-- Moved out of the web app's own sidebar by request — these act like
         real browser-chrome controls (Chrome's own profile/extensions icons
         aren't part of the loaded website either), navigating the active
         tab rather than being page content themselves. -->
    <div id="toolbar-actions">
      <button class="tool-icon-btn" id="bell-btn" title="Notifications" aria-label="Notifications">
        <svg viewBox="0 0 16 16" width="19" height="19"><path d="M8 1.8c-1.9 0-3.2 1.5-3.2 3.4v2c0 .5-.2 1.2-.5 1.7l-.6.9c-.5.7 0 1.7.9 1.7h6.8c.9 0 1.4-1 .9-1.7l-.6-.9c-.3-.5-.5-1.2-.5-1.7v-2c0-1.9-1.3-3.4-3.2-3.4Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.6 13.4a1.5 1.5 0 0 0 2.8 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span id="bell-badge" hidden></span>
      </button>
      <button class="tool-icon-btn" data-nav="/help" title="Help" aria-label="Help">
        <svg viewBox="0 0 16 16" width="19" height="19"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.1 6.1a2 2 0 1 1 2.9 1.8c-.7.35-.9.7-.9 1.35" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.3" r="0.9" fill="currentColor"/></svg>
      </button>
      <button class="tool-icon-btn" data-nav="/dashboard/feature-requests" title="Feature requests" aria-label="Feature requests">
        <svg viewBox="0 0 16 16" width="19" height="19"><path d="M8 1.5a4 4 0 0 1 2.2 7.3c-.4.3-.7.8-.7 1.3v.4H6.5v-.4c0-.5-.3-1-.7-1.3A4 4 0 0 1 8 1.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.3 12.7h3.4M6.6 14.3h2.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button class="tool-icon-btn" data-nav="/dashboard/audit" title="Audit log" aria-label="Audit log">
        <svg viewBox="0 0 16 16" width="19" height="19"><circle cx="8" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 5.3v3.2l2.2 1.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="tool-icon-btn" data-nav="/dashboard/plan" title="Plan &amp; billing" aria-label="Plan and billing">
        <svg viewBox="0 0 16 16" width="19" height="19"><rect x="1.3" y="3.8" width="13.4" height="8.4" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.3 6.6h13.4" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="9" width="3.5" height="1.4" rx="0.5" fill="currentColor"/></svg>
      </button>
      <!-- A real cog, NOT a circle-with-radiating-lines — that reads as a
           sun/brightness control, which is exactly the confusion reported. -->
      <button class="tool-icon-btn" data-nav="/dashboard/settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button id="profile-btn" class="tool-icon-btn" title="Profile" aria-label="Profile menu">
        <!-- Populated at runtime by index.ts: either an <img> (real avatar)
             or a colored initials circle — never the placeholder person
             icon shown here, which is only a layout fallback before the
             active tab has reported its profile (see onUserProfileChanged). -->
        <span id="profile-avatar" class="avatar-fallback">?</span>
      </button>
      <!-- The profile menu is NOT here: it opens as a real popup window
           (main/popup.ts). Anything rendered below the chrome strip is
           covered by the active tab's native WebContentsView and would be
           invisible. Same for the history dropdown. -->
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
