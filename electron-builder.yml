appId: com.projectrd.desktop
productName: ProjectRD
directories:
  output: release

files:
  - dist/**
  - package.json

extraResources:
  # raw-print.ps1 is spawned directly from resourcesPath at runtime by
  # services/printing/raw-print.ts — must ship alongside the app, not just
  # live in the source tree.
  - resources/raw-print.ps1

win:
  target: nsis
  icon: build/icons/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: DevHydeOut
  repo: project-rd-desktop
